# A release of orOS Bridge for Windows (and Linux x64 since 0.3.0), started by hand (Actions → release →
# Run workflow). It builds and tests like build.yml and leaves a DRAFT
# release with the exe, a zip (exe, the GPLv3 ASIO module oros-bridge-asio.dll, README, LICENSE,
# THIRD_PARTY), the ASIO module on its own and their
# SHA-256 sums; the owner tries it and publishes it. Asset names do not
# change between versions, so
# https://github.com/koulaxizis/oros-bridge/releases/latest/download/oros-bridge-windows-x64.exe
# always gives the newest published one (orOS links it).
name: release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(oros_bridge VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "TAG=v$v" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory out, zip | Out-Null
          Copy-Item build/Release/oros-bridge.exe out/oros-bridge-windows-x64.exe
          # the ASIO module (GPLv3): beside the exe in the zip, and on its own for people who took the exe
          Copy-Item build/Release/oros-bridge-asio.dll out/
          Copy-Item build/Release/oros-bridge.exe, build/Release/oros-bridge-asio.dll, README.md, LICENSE, THIRD_PARTY.md zip/
          Copy-Item asio/LICENSE zip/LICENSE-asio.txt
          Compress-Archive -Path zip/* -DestinationPath out/oros-bridge-windows-x64.zip
          $sums = Get-ChildItem out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "orOS Bridge ${TAG#v}" \
              --notes "Windows x64: download oros-bridge-windows-x64.exe, run it and keep its window open while you use orOS Studio (Studio → a track's settings → Plugin on this computer). ASIO®: oros-bridge-asio.dll goes next to the exe (the zip has both); it is GPLv3, source in asio/. ASIO is a registered trademark of Steinberg Media Technologies GmbH. ![ASIO Compatible](https://raw.githubusercontent.com/koulaxizis/oros-bridge/main/asio/logo/asio-compatible-bw.png) The exe is not signed yet: Windows SmartScreen may ask once (More info → Run anyway). Linux x64: install oros-bridge-linux-x64.deb (Debian, Ubuntu, Mint) or .rpm (Fedora, openSUSE) and open orOS Bridge from the applications menu, or make oros-bridge-linux-x64.AppImage executable and run it; the tar.gz has the bare program. Plugin windows need X11 or XWayland; the tray icon needs AppIndicator support (on GNOME the AppIndicator extension). Record through your sound card: Studio → Settings → Sound card → orOS Bridge. Hear yourself through a plugin while you record (Sound card → Listen through a plugin, 0.5.0); play an instrument plugin from a MIDI keyboard (0.6.0). New versions show in the window and the tray menu and install with one click, checked against SHA256SUMS.txt (0.8.0). SHA-256 sums in SHA256SUMS.txt. Free, MIT." \
              out/*
          fi
  # Linux x64 (0.3.0, the sound card: JACK, PipeWire/PulseAudio, ALSA): built
  # on the oldest supported Ubuntu so it runs on older systems too; since
  # 0.7.0 a window and tray icon, plugin windows on X11, and .deb, .rpm and
  # AppImage beside the tar.gz (packaging/linux); added to the same draft release.
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CMake 3.28+
        run: pip install --user "cmake>=3.28,<4" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: X11 headers and Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev xvfb desktop-file-utils
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure && xvfb-run -a ctest --test-dir build --output-on-failure
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Package and add to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^project(oros_bridge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          sh packaging/linux/package-all.sh out
          gh release download "v$v" --pattern SHA256SUMS.txt --dir out
          (cd out && sha256sum oros-bridge-linux-x64.* >> SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "v$v" out/oros-bridge-linux-x64.* out/SHA256SUMS.txt --clobber
