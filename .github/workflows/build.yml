name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/oros-bridge.exe, build/Release/oros-bridge-asio.dll dist/
          Copy-Item asio/LICENSE dist/LICENSE-asio.txt
          Copy-Item README.md, LICENSE, THIRD_PARTY.md dist/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: oros-bridge-windows-x64
          path: dist/
